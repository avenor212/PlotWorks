"Angle (in degrees) between two lines, below which we merge them into a single straight line. Increasing this value (~1-5) can help when using a cutter, as it reduces the frequency of corrective swivels being made that could cause tearing." = "两条线之间的夹角（度），低于此角度时合并为一条直线。增大该值（约 1-5）对切割有帮助，可减少可能造成撕裂的纠正旋转次数。"

[context."New Project"]
"_New" = "新建"

[context."Number of Passes Tooltip"]
"How many times the tool should pass over the same area. Multiple passes can be used to cut/draw deeper or darker, or to improve quality by going over the same path multiple times." = "工具在同一区域重复走刀的次数。多次走刀可切/画得更深或更黑，或通过重复路径提升质量。"

[context."Optimise Drawing Paths Tooltip"]
"Optimises the order in which lines are drawn to minimise travel time." = "优化线条绘制顺序以缩短移动时间。"
"Particularly useful for ordering lines when filling shapes." = "在填充图形时对线条排序尤其有用。"

[context."Outlines Before Fill Tooltip"]
"Draws the outlines of shapes before filling them in." = "先绘制图形轮廓，再进行填充。"
"Usually you want to draw outlines after filling." = "通常建议在填充之后再绘制轮廓。"

[context."Overcut Tooltip"]
"Extends cuts by the specified amount to compensate for cutting moves ending slightly too early." = "将切割延长指定量，以补偿切割动作略微提前结束。"
"Recommended value ~1mm" = "推荐值约 1mm"

[context."Preview Tab"]
"Preview" = "预览"

[context."Preview toolpath animation"]
"Preview" = "预览"

[context."Printer Bed"]
"Bed Dimensions" = "打印床尺寸"

[context."RegionDetection Tooltip"]
"Black & White - Uses a single threshold to collapse the image into two tones. More useful for scanned paper." = "黑白 - 使用单一阈值把图像压缩为两种色调。更适合扫描纸张。"
"Chooses the algorithm used to form regions before tracing." = "选择描摹前用于形成区域的算法。"
"Colour Cluster - Groups pixels of similar colour together to determine boundaries" = "颜色聚类 - 将相似颜色的像素分组以确定边界"
"Default = Colour Clustering" = "默认 = 颜色聚类"
"Watershed - uses a hierarchical algorithm to form content-adaptive regions that closely follow object shape." = "分水岭 - 使用分层算法形成贴合物体形状的内容自适应区域。"

[context."SVG Path /Shape Details"]
"Exclusions" = "排除项"
"Nodes" = "节点"
"Shapes" = "图形"

[context."Shading Angle Tooltip"]
"0° represents East, with positive values rotating counterclockwise." = "0° 表示东方，正值逆时针旋转。"
"Which Direction to draw when shading objects." = "填充物体阴影时的绘制方向。"

[context."Shading Threshold Tooltip"]
"How bright an object should be in order to be shaded. 0 = shade all objects, 1 = shade only fully bright objects." = "物体需要多亮才会被填充阴影。0 = 填充所有物体，1 = 只填充全亮的物体。"
"Range = 0 to 1" = "范围 = 0 到 1"

[context."Stacking Mode Tooltip"]
" NOTE: " = " 注意："
" Tracing mode = spline." = " 描摹模式 = 样条。"
"Controls how the detected regions are layered on top of one another." = "控制检测到的区域如何相互叠加。"
"Cutout - " = "镂空 - "
"Cutout V2 - " = "镂空 V2 - "
"Cutout will cause a ripple/oscillating effect visible along edges. This is a VTracer bug for now. If the ripples are too obvious, correct them with Path Simplification or use the Stacked option instead. " = "镂空模式会在边缘产生可见的波纹/振荡效果。这是 VTracer 目前的缺陷。如果波纹太明显，可用路径简化修正，或改用堆叠模式。"
"Layers each region as a separate overlapping shape, like sheets of coloured paper. Can provide the cleanest edges to shapes, but can require a lot more cleanup effort after import." = "把每个区域作为独立的重叠图形分层，像彩色纸片一样。图形的边缘最干净，但导入后可能需要更多清理。"
"Produces a true seam-free mosaic, avoiding overlaps or visible seams between regions." = "生成真正的无缝马赛克，避免区域间的重叠或可见接缝。"
"Same as Cutout, but with my own attempt at fixing the ripple/oscillating effect in VTracer. Only works with" = "与镂空相同，但尝试修复了 VTracer 的波纹/振荡效果。仅适用于"
"Stacked - " = "堆叠 - "
"Stacking (Default = Cutout)" = "堆叠模式（默认 = 镂空）"

[context."Tool Diameter Tooltip"]
"Most blades are ~1mm in diameter, however the point of the blade may not be at the very edge." = "大多数刀片直径约 1mm，但刀尖可能不在最边缘。"
"Setting the tool diameter correctly adds a compensatory swivel for blade rotation to align with the next move. This is most noticeable on tiny features." = "正确设置刀具直径会为刀片旋转添加补偿旋转，使其对准下一步移动。在微小特征上最明显。"
"of the swivelling part of the cutting blade." = "切割刀片旋转部分的。"

[context."Tool Mode"]
"Cut" = "切割"
"Draw" = "绘制"

[context."Tool Mode Tooltip"]
"Settings designed for cutting objects out using a drag-knife." = "为使用拖刀切割物体而设计的设置。"
"Settings designed for drawing using a pen, marker, or even a foil stamping pen." = "为使用笔、马克笔甚至烫金笔绘制而设计的设置。"

[context."Tool Offsets Tooltip"]
"Installation offset of the cutting tool on the X axis. This is added on top of the Toolhead Offset." = "切割工具在 X 轴上的安装偏移。会叠加在工具头偏移之上。"
"Installation offset of the cutting tool on the Y axis. This is added on top of the Toolhead Offset." = "切割工具在 Y 轴上的安装偏移。会叠加在工具头偏移之上。"
"Installation offset of the drawing tool on the X axis. This is added on top of the Toolhead Offset." = "绘制工具在 X 轴上的安装偏移。会叠加在工具头偏移之上。"
"Installation offset of the drawing tool on the Y axis. This is added on top of the Toolhead Offset." = "绘制工具在 Y 轴上的安装偏移。会叠加在工具头偏移之上。"

[context."Tool Speed Tooltip"]
"Slower is usually better" = "通常越慢越好"
"Speed of the toolhead when the tool is down and cutting/drawing." = "工具落下进行切割/绘制时的工具头速度。"

[context."TracingMode Tooltip"]
"Fits edges using smooth curves for organic outlines." = "用平滑曲线拟合边缘，适合有机轮廓。"
"Keeps hard, blocky pixel-edge outlines with no curve fitting. Great for pixel art" = "保留硬朗的像素块状边缘，不做曲线拟合。适合像素画"
"Pixel - " = "像素 - "
"Polygon - " = "多边形 - "
"Sets the curve-fitting style used to outline each region." = "设置描摹各区域轮廓时使用的曲线拟合方式。"
"Spline - " = "样条 - "
"Tracing Mode (Default = Spline)" = "描摹模式（默认 = 样条）"
"Uses straight line segments" = "使用直线段"

[context."Travel Speed ToolTip"]
"Speed of the toolhead when the tool is raised and not actively cutting/drawing." = "工具抬起、未切割/绘制时的工具头速度。"

[context."Z Height Tooltip"]
"How high above the workpiece the toolhead should be positioned when travelling or drawing." = "移动或绘制时工具头应高于工件的高度。"
"Positive values are offset above the bed surface." = "正值表示高于床面。"
"This value is affected by your printer's Z-Offset." = "此值受打印机 Z 偏移影响。"

[context."Z Offset Per Pass Tooltip"]
"For cutting or engraving thicker materials, a slightly negative value can be used to gradually cut deeper with each pass, which can improve quality and reduce the chance of blade breakage." = "切割或雕刻较厚材料时，可用略负的值在每次走刀时逐渐切得更深，从而提升质量并降低断刀风险。"
"Positive values move the tool up after each pass, while negative values move the tool down after each pass." = "正值表示每次走刀后工具上移，负值表示下移。"
"The distance in Z that the tool should move after each pass when multiple passes are enabled." = "启用多次走刀时，每次走刀后工具在 Z 方向移动的距离。"

